name: CI

on:
  push:
    branches: [main, develop, Dat]
  pull_request:
    branches: [main, develop, Dat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Reject unresolved merge conflicts
        shell: bash
        run: |
          if git grep -nE '(^<<<<<<< |^=======$|^>>>>>>> )'; then
            echo "Unresolved merge conflict markers were committed."
            exit 1
          fi

  lint-test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/castravision_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret
      DEBUG: "false"
      ENVIRONMENT: test
      PYTHON_DOTENV_DISABLED: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: castravision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d castravision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check CastraVision CastraServices
      - name: Django system and migration checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: Test
        run: python -m pytest --cov=CastraServices --cov-report=term-missing

  lint-test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CastraView
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: CastraView/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  test-supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Start isolated Supabase stack
        run: npx --yes supabase@2.121.0 start >/dev/null 2>&1
      - name: Test database migrations and policies
        run: npx --yes supabase@2.121.0 test db
      - name: Reset local database
        run: npx --yes supabase@2.121.0 db reset --local
      - name: Test database after reset
        run: npx --yes supabase@2.121.0 test db
      - name: Stop local Supabase stack
        if: always()
        run: npx --yes supabase@2.121.0 stop --no-backup || true

