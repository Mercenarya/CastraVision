name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: castravision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d castravision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Lint
        run: ruff check CastraVision CastraServices
      - name: Migrate and test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/castravision_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-secret
          DEBUG: "false"
        run: |
          python manage.py migrate --noinput
          pytest --cov=CastraServices --cov-report=term-missing

  lint-test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CastraView
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: CastraView/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

